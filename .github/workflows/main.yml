# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      libneo_ref:
        default: ''
      # Accepted for a uniform full-ci dispatch. The build and focused native
      # sparse checks run for each candidate; full does not expand that scope.
      full:
        default: 'false'

env:
  GIT_HTTPS: "true"

jobs:
  code:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: setup/debian.sh

      - name: Build
        run: make ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      - name: Native sparse and FreeFem correctness checks
        run: ctest --test-dir build -R '^(native_(sparse|freefem)_|freefem_(failure|protocol)$)' --output-on-failure -j 2
