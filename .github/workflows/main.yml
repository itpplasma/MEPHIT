# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      libneo_ref:
        default: ''
      # Accepted for a uniform full-ci dispatch. The build and focused native
      # sparse checks run for each candidate; full does not expand that scope.
      full:
        default: 'false'

env:
  GIT_HTTPS: "true"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    name: Build and test
    runs-on: [self-hosted, itp-ubuntu24]
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install dependencies
        run: setup/debian.sh

      - name: Build
        run: make ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

      - name: Native sparse and FreeFem correctness checks
        run: ctest --test-dir build -R '^(native_(sparse|freefem)_|freefem_(failure|protocol)$)' --output-on-failure -j 2
