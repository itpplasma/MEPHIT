# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Pull requests and the merge queue; main itself is not re-tested on push
  pull_request:
  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      libneo_ref:
        default: ''
      # Accepted for a uniform full-ci gate dispatch; MEPHIT CI is build-only, so the
      # build against the candidate libneo is the gate and full changes nothing.
      full:
        default: 'false'

env:
  GIT_HTTPS: "true"

jobs:
  code:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: setup/debian.sh

      - name: Build
        run: make ${{ inputs.libneo_ref != '' && format('LIBNEO_REF={0}', inputs.libneo_ref) || '' }}
